# Project-wide Gradle settings.

# Specifies the JVM arguments used for the Gradle Daemon.
# Setting a higher heap size (4GB) prevents D8 / dexing compiler OutOfMemoryError.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# Parallel execution and build cache
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true

# Suppress deprecated Gradle version warnings from Kotlin 2.4 plugin
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
